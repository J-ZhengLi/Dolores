[workspace]
members = ["crates/dolores-core", "crates/dolores-provider-openai", "crates/dolores-store-sqlite", "crates/dolores-credentials", "crates/dolores-tools-fs", "crates/dolores-tools-command", "crates/dolores-tools-mcp", "crates/dolores-tools-web", "crates/dolores-native", "crates/dolores-flutter-bridge", "src-tauri"]
resolver = "2"
default-members = ["crates/dolores-core", "crates/dolores-provider-openai", "crates/dolores-store-sqlite", "crates/dolores-credentials", "crates/dolores-flutter-bridge"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
