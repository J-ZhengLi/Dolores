[workspace]
members = ["crates/dolores-native-update", "crates/dolores-desktop-helper", "crates/dolores-mod-runtime", "crates/dolores-core", "crates/dolores-provider-openai", "crates/dolores-store-sqlite", "crates/dolores-credentials", "crates/dolores-tools-fs", "crates/dolores-tools-command", "crates/dolores-tools-mcp", "crates/dolores-tools-web", "crates/dolores-tools-browser", "crates/dolores-flutter-bridge"]
resolver = "2"
default-members = ["crates/dolores-core", "crates/dolores-provider-openai", "crates/dolores-store-sqlite", "crates/dolores-credentials", "crates/dolores-flutter-bridge"]

[workspace.package]
version = "0.0.1-alpha"
edition = "2021"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# MCP tests fingerprint real runtimes before and after inspection. Keep SHA-256
# compression optimized so debug hashing does not consume the operation deadline
# on shared Windows runners; production timeout limits remain unchanged.
[profile.test.package.sha2]
opt-level = 3

# Digest::update and its block-buffer code are generic and instantiated in the
# caller. Optimizing sha2 alone leaves MCP's runtime hashing unoptimized when
# the CPU lacks SHA acceleration. Preserve the real 30-second operation limit.
[profile.test.package.dolores-tools-mcp]
opt-level = 3
