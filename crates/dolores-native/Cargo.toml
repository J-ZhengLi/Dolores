[package]
name = "dolores-native"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
smoke = ["dep:png", "dep:log"]

[dependencies]
dolores-core = { path = "../dolores-core" }
dolores-provider-openai = { path = "../dolores-provider-openai" }
dolores-store-sqlite = { path = "../dolores-store-sqlite" }
iced = { version = "=0.14.0", default-features = false, features = ["tiny-skia", "tokio", "x11", "wayland", "linux-theme-detection"] }
directories = "6"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
png = { version = "0.18", optional = true }
log = { version = "0.4", optional = true }

[dev-dependencies]
async-trait.workspace = true
tempfile = "3"
