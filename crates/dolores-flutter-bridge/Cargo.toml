[package]
name = "dolores-flutter-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
async-trait.workspace = true
tempfile = "3"
dolores-core = { path = "../dolores-core" }
dolores-native-update = { path = "../dolores-native-update" }
dolores-mod-runtime = { path = "../dolores-mod-runtime" }
dolores-provider-openai = { path = "../dolores-provider-openai" }
dolores-store-sqlite = { path = "../dolores-store-sqlite" }
dolores-credentials = { path = "../dolores-credentials" }
dolores-tools-fs = { path = "../dolores-tools-fs" }
dolores-tools-command = { path = "../dolores-tools-command" }
dolores-tools-mcp = { path = "../dolores-tools-mcp" }
dolores-tools-web = { path = "../dolores-tools-web" }
dolores-tools-browser = { path = "../dolores-tools-browser" }
directories = "6"
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
sha2 = "0.10"
miniz_oxide = "0.8"
syn = { version = "2", features = ["full", "visit"] }
quote = "1"
tokio = { workspace = true, features = ["process", "io-util"] }
tokio-util.workspace = true
uuid.workspace = true

[build-dependencies]
sha2 = "0.10"
miniz_oxide = "0.8"

[dev-dependencies]
async-trait.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_System_Threading"] }
