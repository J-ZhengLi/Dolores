[package]
name = "dolores-native-update"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "dolores-update-launcher"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Environment", "Win32_Security"] }
