name: Checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      FLUTTER_SDK: ${{ github.workspace }}/.ci/flutter
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
      CARGO_TERM_COLOR: always
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out Dolores
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Set up Node for fixtures
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1' # Keep native fixture reproduction on an explicit baseline.
      - name: Install pinned history audit test tool
        run: python -m pip install --require-hashes -r .github/requirements-ci.txt
      - name: Check out pinned Flutter SDK
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: flutter/flutter
          ref: 6a19cca56475dbfba1478ee68d7bd0c2ef891da1 # 3.47.5
          # Flutter derives its SDK version from Git release tags.
          fetch-depth: 0
          path: .ci/flutter
          persist-credentials: false
      - name: Prepare active Rust toolchain
        shell: pwsh
        run: |
          rustup component add rustfmt clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore dependency and compiler caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .ci/flutter/bin/cache
            ~/AppData/Local/Pub/Cache
          key: windows-2025-rust-active-flutter-3.47.5-${{ hashFiles('Cargo.lock', 'apps/dolores_flutter/pubspec.lock') }}
      - name: Check source and deterministic fixtures
        shell: pwsh
        run: |
          python scripts/release.py check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($script in @('check-publication.py', 'check-docs.py', 'test-docs.py', 'test-publication.py', 'test-release.py', 'test-installer.py', 'test-installer-lifecycle.py', 'test-package-windows.py', 'test-windows-launcher.py', 'test-regression-runner.py')) {
            python "scripts/$script"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Rust checks
        shell: pwsh
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Browser fixtures
        shell: pwsh
        run: |
          npm --prefix adapters/browser ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test adapters/browser/worker.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test-browser-installer.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Flutter checks
        working-directory: apps/dolores_flutter
        shell: pwsh
        run: |
          & "$env:FLUTTER_SDK/bin/flutter.bat" pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:FLUTTER_SDK/bin/flutter.bat" analyze --no-pub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:FLUTTER_SDK/bin/flutter.bat" test --no-pub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
