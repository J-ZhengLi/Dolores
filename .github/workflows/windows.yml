name: Windows

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      FLUTTER_SDK: ${{ github.workspace }}/.ci/flutter
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out Dolores
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Set up Node for fixtures
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install pinned history audit test tool
        run: python -m pip install --require-hashes -r .github/requirements-ci.txt
      - name: Check out pinned Flutter SDK
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: flutter/flutter
          ref: 6a19cca56475dbfba1478ee68d7bd0c2ef891da1 # 3.47.5
          path: .ci/flutter
          persist-credentials: false
      - name: Set up pinned Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy,rust-docs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.95.0
      - name: Check source, fixtures and normal build
        run: python scripts/ci-windows.py check
      - name: Package Windows x64
        run: python scripts/ci-windows.py package
      - name: Retain verified preview package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dolores-windows-x64
          path: output/ci-windows/package/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download this run's verified package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dolores-windows-x64
          path: package
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath package -File | Where-Object { $_.Name -like '*.zip' -or $_.Name -like '*.sha256' } | ForEach-Object { $_.FullName })
          if ($assets.Count -ne 2) { throw 'Expected one ZIP and its checksum.' }
          gh release create $env:RELEASE_TAG @assets --verify-tag --draft --title "Dolores $env:RELEASE_TAG" --notes-file package/RELEASE-NOTES.md
